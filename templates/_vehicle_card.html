{% macro card(vehicle) %}
<a href="{{ url_for('vehicles.browse_detail', id=vehicle.id) }}" class="vehicle-card">
 <div class="vehicle-card-media">
  <img src="{{ vehicle.image_url or 'https://images.unsplash.com/photo-1503376780353-7e6692767b70?q=80&w=800&auto=format&fit=crop' }}" alt="{{ vehicle.make }} {{ vehicle.model }}" />
  <span class="status-badge status-{{ vehicle.status | lower }}">{{ vehicle.status }}</span>
 </div>
 <div class="vehicle-card-body">
  <h3>{{ vehicle.year }} {{ vehicle.make }} {{ vehicle.model }}</h3>
  <p class="vehicle-card-meta">{{ '{:,}'.format(vehicle.mileage) }} mi</p>
  <div class="vehicle-card-footer">
   <span class="vehicle-card-price">${{ '{:,.0f}'.format(vehicle.price) }}</span>
   <span class="btn btn-outline">View</span>
  </div>
 </div>
</a>
{% endmacro %}
